<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" font-family="Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="못 지우는 두 코드의 이유 비교">
  <defs>
    <marker id="uGray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>

  <rect x="8" y="8" width="320" height="200" rx="12" fill="#f6f7f8" stroke="#e5e7eb"/>
  <text x="168" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">내가 만든 코드</text>
  <rect x="32" y="50" width="272" height="42" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="168" y="68" text-anchor="middle" font-size="12.5" fill="#1f2328">진입 시 유저 정보 초기화</text>
  <text x="168" y="85" text-anchor="middle" font-size="12" fill="#6b7280">최상위로 끌어올려 일원화</text>
  <line x1="168" y1="92" x2="168" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#uGray)"/>
  <rect x="32" y="110" width="272" height="80" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="168" y="132" text-anchor="middle" font-size="12" fill="#6b7280">결합은 매우 강하다</text>
  <text x="168" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">누가 무엇을 쓰는지가</text>
  <text x="168" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">코드에 안 적혀 있다</text>

  <rect x="352" y="8" width="320" height="200" rx="12" fill="#f6f7f8" stroke="#e5e7eb"/>
  <text x="512" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">전임자가 남긴 코드</text>
  <rect x="376" y="50" width="272" height="42" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="512" y="68" text-anchor="middle" font-size="12.5" fill="#1f2328">에디터 커스터마이징</text>
  <text x="512" y="85" text-anchor="middle" font-size="12" fill="#6b7280">양쪽이 서로 다르다</text>
  <line x1="512" y1="92" x2="512" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#uGray)"/>
  <rect x="376" y="110" width="272" height="80" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="512" y="132" text-anchor="middle" font-size="12" fill="#6b7280">결합은 오히려 약하다</text>
  <text x="512" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">왜 있는지 모르는 데다</text>
  <text x="512" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">깨져도 보이지 않는다</text>

  <rect x="8" y="224" width="664" height="64" rx="12" fill="#fdf1f0" stroke="#f4c7c2"/>
  <text x="340" y="250" text-anchor="middle" font-size="13" fill="#b4544a">결합의 세기는 둘이 정반대였다. 그런데 둘 다 못 지운다.</text>
  <text x="340" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#b4544a">지울 수 있는지를 정한 것은 왜 있는지가 남아 있는지와, 깨짐이 보이는지였다</text>
</svg>
