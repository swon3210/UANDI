<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="경계를 강제하는 다섯 단계. 아래로 갈수록 위반이 빨리 잡힌다">
  <defs>
    <marker id="lCoral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e8837a"/></marker>
  </defs>

  <line x1="26" y1="20" x2="26" y2="292" stroke="#e8837a" stroke-width="1.5" marker-end="url(#lCoral)"/>
  <text x="16" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#b4544a" transform="rotate(-90 16 150)">위반이 빨리 잡힌다</text>

  <rect x="48" y="14" width="624" height="46" rx="8" fill="#f6f7f8" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="74" y="42" font-size="13" fill="#9ca3af">1</text>
  <text x="102" y="42" font-size="13.5" fill="#6b7280">문서와 관례</text>
  <text x="652" y="42" text-anchor="end" font-size="12.5" fill="#9ca3af">아무도 안 잡는다</text>

  <rect x="48" y="68" width="624" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="74" y="96" font-size="13" fill="#9ca3af">2</text>
  <text x="102" y="96" font-size="13.5" fill="#6b7280">코드 리뷰</text>
  <text x="652" y="96" text-anchor="end" font-size="12.5" fill="#9ca3af">사람이 볼 때만</text>

  <rect x="48" y="122" width="624" height="46" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="74" y="150" font-size="13" fill="#6b7280">3</text>
  <text x="102" y="150" font-size="13.5" fill="#1f2328">린트, CI, git hook</text>
  <text x="652" y="150" text-anchor="end" font-size="12.5" fill="#6b7280">저장하거나 PR을 열면</text>

  <rect x="48" y="176" width="624" height="46" rx="8" fill="#ffffff" stroke="#e8837a" stroke-width="2"/>
  <text x="74" y="204" font-size="13" fill="#b4544a">4</text>
  <text x="102" y="204" font-size="13.5" font-weight="700" fill="#1f2328">타입</text>
  <text x="652" y="204" text-anchor="end" font-size="12.5" fill="#b4544a">컴파일할 때</text>

  <rect x="48" y="230" width="624" height="46" rx="8" fill="#fdf1f0" stroke="#e8837a" stroke-width="2"/>
  <text x="74" y="258" font-size="13" fill="#b4544a">5</text>
  <text x="102" y="258" font-size="13.5" font-weight="700" fill="#1f2328">구조적으로 불가능</text>
  <text x="652" y="258" text-anchor="end" font-size="12.5" fill="#b4544a">애초에 그렇게 못 쓴다</text>

  <text x="360" y="308" text-anchor="middle" font-size="13" fill="#6b7280">내가 그어둔 경계는 전부 1번에 있었다. 강제되지 않는 경계는 지켜달라는 부탁에 가깝다.</text>
</svg>
